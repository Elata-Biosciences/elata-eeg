name: EEG Daemon Test Suite

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  schedule:
    # Run tests daily at 2 AM UTC to catch dependency issues
    - cron: '0 2 * * *'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - stable
          - beta
        
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@v1
      with:
        toolchain: ${{ matrix.rust }}
        components: rustfmt, clippy
    
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-
    
    # Install system dependencies for Linux
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libudev-dev
    
    # Check formatting
    - name: Check formatting
      run: cargo fmt --all -- --check
    
    # Run clippy on core packages only
    - name: Clippy
      run: cargo clippy -p eeg_types --all-targets -- -D warnings
    
    # Build core packages (skip hardware-dependent ones that fail on Ubuntu)
    - name: Build Core Packages
      run: |
        cargo build -p eeg_types
        echo "✅ Core packages built successfully"
    
    # Run core unit tests (hardware-independent)
    - name: Run Unit Tests
      run: |
        # Test comprehensive EEG types (31 tests covering critical math and algorithms)
        echo "🧮 Running mathematical validation tests..."
        cargo test -p eeg_types --verbose
        
        echo "📊 Running performance benchmarks..."
        cargo bench -p eeg_types --bench critical_math_benchmarks
    
    # Integration tests are skipped in CI due to hardware dependencies
    # They should be run manually on Linux/Pi platforms
    - name: Integration Test Status
      run: |
        echo "🔧 Integration tests skipped in CI due to hardware dependencies"
        echo "To run integration tests:"
        echo "  Linux: cargo test -p sensors --features='mock_eeg' --no-default-features"
        echo "  Pi:    cargo test --workspace --features='boards/elata_v2'"
    
    # Test documentation for core packages only
    - name: Test documentation
      run: cargo doc -p eeg_types --no-deps

  # Separate job for hardware-specific tests (only run on ARM/Pi if available)
  hardware-tests:
    name: Hardware Tests
    runs-on: self-hosted
    # Only run if we have self-hosted Pi runners available
    if: false  # Disabled for now, enable when Pi runners are available
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@v1
      with:
        toolchain: stable
    
    - name: Run hardware tests
      run: |
        # These would run on actual Raspberry Pi hardware
        cargo test -p sensors --features="ads1299"
        cargo test -p boards --features="elata_v2"
        cargo test -p adc_daemon --features="boards/elata_v2"

  # Security audit
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: rustsec/audit-check@v1.4.1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

  # Check for unused dependencies (core packages only)
  unused-deps:
    name: Unused Dependencies
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@v1
      with:
        toolchain: nightly
        components: rustfmt, clippy
    - name: Install cargo-udeps
      run: cargo install cargo-udeps --locked
    - name: Check unused dependencies
      run: cargo +nightly udeps -p eeg_types --all-targets
