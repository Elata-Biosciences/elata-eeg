[package]
name = "eeg_types"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
bytes = { version = "1.0", features = ["serde"] }
thiserror = "1.0"

[dev-dependencies]
serde_json = "1.0"
criterion = { version = "0.5", features = ["html_reports"] }

[features]
meta-tags = []

[[bench]]
name = "critical_math_benchmarks"
harness = false